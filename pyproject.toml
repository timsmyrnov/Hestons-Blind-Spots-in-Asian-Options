[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hestonlab-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=18,<27", "duckdb==1.4.2", "databento==0.88.0", "pdfplumber==0.11.9", "zstandard==0.25.0", "scipy>=1.14,<2"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2", "QuantLib==1.44"]
animation = ["matplotlib>=3.8,<4", "imageio-ffmpeg>=0.5,<0.7"]
neural = ["torch>=2.8,<3"]
[project.scripts]
hestonlab-data = "hestonlab.data.__main__:main"
hestonlab-weekly = "hestonlab.weekly_pipeline:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
hestonlab = ["native/*.cpp", "weekly_heatmap.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"src/hestonlab/data/acquisition.py" = ["F405", "F403"]
